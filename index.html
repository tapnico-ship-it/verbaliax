<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbaliax | Corrector Académico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #60a5fa;
    }
    .quota {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 500;
      color: #60a5fa;
    }
    .quota.warning { color: #f97316; }
    .quota.error { color: #ef4444; }
    #api-key {
      padding: 10px 15px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      width: 280px;
      font-size: 14px;
    }
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .panel h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #cbd5e1;
    }
    textarea {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 12px;
      color: #e2e8f0;
      resize: none;
      font-family: monospace;
      font-size: 14px;
      min-height: 300px;
    }
    textarea:focus { outline: none; border-color: #60a5fa; }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #60a5fa;
      color: white;
      flex: 1;
    }
    .btn-primary:hover:not(:disabled) { background: #3b82f6; }
    .btn-secondary {
      background: #475569;
      color: white;
    }
    .btn-secondary:hover { background: #334155; }
    .maintenance {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .maintenance.active { display: flex; }
    .maintenance-content {
      text-align: center;
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      border: 2px solid #f97316;
    }
    .maintenance h2 {
      font-size: 32px;
      color: #f97316;
      margin-bottom: 20px;
    }
    .maintenance p {
      font-size: 16px;
      color: #cbd5e1;
      margin-bottom: 10px;
    }
    @media (max-width: 768px) {
      .main { grid-template-columns: 1fr; }
      header { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🙋 Verbaliax</h1>
      <div class="quota" id="quota-display">CUOTA: 0/1500</div>
      <input type="text" id="api-key" placeholder="Gemini API Key">
    </header>

    <div class="main">
      <div class="panel">
        <h2>Borrador Original</h2>
        <textarea id="input-text" placeholder="Escribe tu texto aquí..."></textarea>
        <div class="buttons">
          <button class="btn-secondary" onclick="clearText()">Limpiar</button>
          <button class="btn-primary" id="correct-btn" onclick="processText()">Mejorar Texto</button>
        </div>
      </div>

      <div class="panel">
        <h2>Versión Perfeccionada</h2>
        <div id="output-text" style="flex:1; padding:12px; background:#0f172a; border-radius:4px; border:1px solid #334155; overflow-y:auto; white-space:pre-wrap; word-break:break-word;">El texto mejorado aparecerá aquí...</div>
        <div class="buttons">
          <button class="btn-secondary" onclick="copyText()">Copiar</button>
          <button class="btn-secondary" onclick="downloadText()">Descargar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="maintenance" id="maintenance">
    <div class="maintenance-content">
      <h2>🚧 Sistema en Mantenimiento</h2>
      <p>Has alcanzado tu límite diario de 1500 peticiones.</p>
      <p>El contador se reinicia automáticamente a las 00:00.</p>
    </div>
  </div>

  <script>
    const QUOTA_LIMIT = 1500;
    const STORAGE_KEY = 'verbaliax_quota';
    const DATE_KEY = 'verbaliax_date';

    function getQuotaData() {
      const today = new Date().toLocaleDateString();
      const stored = localStorage.getItem(DATE_KEY);
      
      if (stored !== today) {
        localStorage.setItem(DATE_KEY, today);
        localStorage.setItem(STORAGE_KEY, '0');
        return 0;
      }
      return parseInt(localStorage.getItem(STORAGE_KEY) || '0');
    }

    function setQuota(value) {
      localStorage.setItem(STORAGE_KEY, value.toString());
    }

    function incrementQuota() {
      const current = getQuotaData();
      const next = current + 1;
      setQuota(next);
      updateQuotaDisplay(next);
      return next;
    }

    function updateQuotaDisplay(count) {
      const quotaEl = document.getElementById('quota-display');
      const correctBtn = document.getElementById('correct-btn');
      const maintenance = document.getElementById('maintenance');
      
      quotaEl.textContent = `CUOTA: ${count}/${QUOTA_LIMIT}`;
      
      if (count >= QUOTA_LIMIT) {
        quotaEl.classList.add('error');
        correctBtn.disabled = true;
        maintenance.classList.add('active');
      } else if (count >= QUOTA_LIMIT * 0.8) {
        quotaEl.classList.add('warning');
      }
    }

    async function processText() {
      const apiKey = document.getElementById('api-key').value;
      const inputText = document.getElementById('input-text').value;
      const outputEl = document.getElementById('output-text');
      const correctBtn = document.getElementById('correct-btn');

      if (!inputText.trim()) {
        outputEl.textContent = 'Por favor, ingresa texto para mejorar.';
        return;
      }

      if (!apiKey.trim()) {
        outputEl.textContent = 'Por favor, ingresa tu API key de Gemini.';
        return;
      }

      // Check quota before making request
      const currentQuota = getQuotaData();
      if (currentQuota >= QUOTA_LIMIT) {
        document.getElementById('maintenance').classList.add('active');
        correctBtn.disabled = true;
        return;
      }

      correctBtn.disabled = true;
      outputEl.textContent = 'Mejorando texto...';

      try {
        const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `Eres un corrector académico experto. Mejora el siguiente texto manteniendo el significado original pero corrigiendo gramática, ortografía y fluidez. Solo devuelve el texto mejorado sin explicaciones:\n\n${inputText}`
              }]
            }]
          })
        });

        if (!response.ok) {
          throw new Error('Error en API: ' + response.status);
        }

        const data = await response.json();
        const improvedText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Error procesando texto';
        
        // Increment quota on successful request
        incrementQuota();
        outputEl.textContent = improvedText;

      } catch (error) {
        outputEl.textContent = 'Error: ' + error.message;
      } finally {
        correctBtn.disabled = false;
      }
    }

    function clearText() {
      document.getElementById('input-text').value = '';
      document.getElementById('output-text').textContent = 'El texto mejorado aparecerá aquí...';
    }

    function copyText() {
      const text = document.getElementById('output-text').textContent;
      navigator.clipboard.writeText(text);
      alert('Copiado al portapapeles');
    }

    function downloadText() {
      const text = document.getElementById('output-text').textContent;
      const element = document.createElement('a');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
      element.setAttribute('download', 'verbaliax_resultado.txt');
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      const quota = getQuotaData();
      updateQuotaDisplay(quota);
      
      // Auto-save API key
      const apiKey = localStorage.getItem('verbaliax_api_key');
      if (apiKey) document.getElementById('api-key').value = apiKey;
      
      document.getElementById('api-key').addEventListener('change', (e) => {
        localStorage.setItem('verbaliax_api_key', e.target.value);
      });
    });
  </script>
</body>
</html>
